# NOOP browser build — step 3. Creates (or reuses) the Apple Distribution certificate and the four App
# Store provisioning profiles, stored encrypted in your private certificates repository (fastlane match).
# Also runs automatically before every "4. Build NOOP". Adapted from LoopKit/LoopWorkspace.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   ENABLE_NUKE_CERTS = true   renew automatically when the Distribution certificate is expired/missing
#   FORCE_NUKE_CERTS  = true   revoke and recreate certificate + profiles on the next run (then remove it)
name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})

on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

env:
  TEAMID: ${{ secrets.TEAMID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GH_TOKEN: ${{ secrets.GH_PAT }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
  MATCH_REPO: ${{ vars.MATCH_REPO || 'NOOP-Match-Secrets' }}

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/noop_validate_secrets.yml
    secrets: inherit

  create_certs:
    name: Certificates
    needs: validate
    runs-on: macos-26
    outputs:
      new_certificate_needed: ${{ steps.set_output.outputs.new_certificate_needed }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install Project Dependencies
        run: bundle install

      # Keep match from printing its parameter tables into the (public) log.
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "::warning::table_printer.rb not found — match tables will be printed (harmless, secrets stay masked)."
          fi

      # Sync the runner clock (workaround from https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Check and create or update Distribution certificate and profiles if needed
        run: |
          echo "Running Fastlane certs lane..."
          bundle exec fastlane certs || true # a failure here is diagnosed by the next step

      - name: Check Distribution certificate and flag renewal if needed
        run: bundle exec fastlane check_and_renew_certificates
        id: check_certs

      - name: Set output and annotations based on Fastlane result
        id: set_output
        run: |
          CERT_STATUS_FILE="${{ github.workspace }}/fastlane/new_certificate_needed.txt"
          ENABLE_NUKE_CERTS=$(echo "${{ vars.ENABLE_NUKE_CERTS }}" | tr '[:upper:]' '[:lower:]')
          FORCE_NUKE_CERTS=$(echo "${{ vars.FORCE_NUKE_CERTS }}" | tr '[:upper:]' '[:lower:]')

          if [ -f "$CERT_STATUS_FILE" ]; then
            CERT_STATUS=$(cat "$CERT_STATUS_FILE" | tr -d '\n' | tr -d '\r')
            echo "new_certificate_needed: $CERT_STATUS"
            echo "new_certificate_needed=$CERT_STATUS" >> "$GITHUB_OUTPUT"
          else
            echo "Certificate status file not found. Defaulting to false."
            echo "new_certificate_needed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CERT_STATUS" != "true" ] && [ "$ENABLE_NUKE_CERTS" != "true" ]; then
            echo "::notice::🔔 Automated renewal of certificates is disabled because the repository variable ENABLE_NUKE_CERTS is not set to 'true'."
          fi
          if [ "$CERT_STATUS" = "true" ] && [ "$ENABLE_NUKE_CERTS" != "true" ]; then
            echo "::error::❌ No valid distribution certificate found. Automated renewal was skipped because the repository variable ENABLE_NUKE_CERTS is not set to 'true'."
            exit 1
          fi
          if [ "$FORCE_NUKE_CERTS" = "true" ]; then
            echo "::warning::‼️ Nuking of certificates was forced because the repository variable FORCE_NUKE_CERTS is set to 'true'."
          fi

  # Revoke + recreate when the certificate is expired/missing and ENABLE_NUKE_CERTS is 'true', or always
  # when FORCE_NUKE_CERTS is 'true'.
  nuke_certs:
    name: Nuke certificates
    needs: [validate, create_certs]
    runs-on: macos-26
    if: ${{ (needs.create_certs.outputs.new_certificate_needed == 'true' && vars.ENABLE_NUKE_CERTS == 'true') || vars.FORCE_NUKE_CERTS == 'true' }}
    steps:
      - name: Output from step id 'check_certs'
        run: echo "new_certificate_needed=${{ needs.create_certs.outputs.new_certificate_needed }}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: bundle install

      - name: Run Fastlane nuke_certs
        run: |
          set -e
          bundle exec fastlane nuke_certs

      - name: Recreate Distribution certificate after nuking
        run: |
          set -e
          bundle exec fastlane certs

      - name: Add success annotations for nuke and certificate recreation
        if: ${{ success() }}
        run: |
          echo "::warning::⚠️ All Distribution certificates and TestFlight profiles have been revoked and recreated."
          echo "::warning::❗️ If other apps (e.g. Loop) are built by GitHub Actions / fastlane on this Apple team, run their 'Create Certificates' workflow once so they pick up the new certificate."
          echo "::warning::✅ Existing TestFlight builds keep working."
