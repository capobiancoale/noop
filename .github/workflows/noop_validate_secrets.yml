# NOOP browser build — step 1. Checks every secret before anything touches Apple, with a plain error
# message per problem. Also called automatically by "3. Create Certificates" and "4. Build NOOP".
# Adapted from LoopKit/LoopWorkspace (validate_secrets.yml). Setup guide: fastlane/BROWSER_BUILD.md
name: 1. Validate Secrets
run-name: Validate Secrets (${{ github.ref_name }})
on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

env:
  # Private repository holding the encrypted signing certificate + profiles (fastlane match).
  MATCH_REPO: ${{ vars.MATCH_REPO || 'NOOP-Match-Secrets' }}

jobs:
  validate-access-token:
    name: Access
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Validate Access Token
        run: |
          # Ensure that exit codes are handled when output is piped.
          set -o pipefail

          GH_PAT_CLASSIC_PATTERN='^ghp_[a-zA-Z0-9]{36}$'
          GH_PAT_FINE_GRAINED_PATTERN='^github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}$'

          if [ -z "$GH_PAT" ]; then
            failed=true
            echo "::error::The GH_PAT secret is unset or empty. Set it and try again."
          else
            if [[ $GH_PAT =~ $GH_PAT_CLASSIC_PATTERN ]]; then
              provides_scopes=true
              echo "The GH_PAT secret is a structurally valid classic token."
            elif [[ $GH_PAT =~ $GH_PAT_FINE_GRAINED_PATTERN ]]; then
              echo "The GH_PAT secret is a structurally valid fine-grained token."
            else
              unknown_format=true
              echo "The GH_PAT secret does not have a known token format."
            fi

            if ! scopes=$(curl -sS -f -I -H "Authorization: token $GH_PAT" https://api.github.com | { grep -i '^x-oauth-scopes:' || true; } | cut -d ' ' -f2- | tr -d '\r'); then
              failed=true
              if [ -n "$unknown_format" ]; then
                echo "::error::Unable to connect to GitHub using the GH_PAT secret. Verify that it is set correctly (including the 'ghp_' or 'github_pat_' prefix) and try again."
              else
                echo "::error::Unable to connect to GitHub using the GH_PAT secret. Verify that the token exists and has not expired at https://github.com/settings/tokens. If necessary, regenerate it (and update the secret), then try again."
              fi
            elif [[ $scopes =~ repo ]]; then
              echo "The GH_PAT secret has the 'repo' permission."
            elif [ -n "$provides_scopes" ]; then
              failed=true
              echo "The GH_PAT secret is valid, but its scopes are: ${scopes:-none}"
              echo "::error::The GH_PAT secret is lacking the 'repo' scope needed to read and write the $MATCH_REPO repository. Edit the token at https://github.com/settings/tokens, tick 'repo', and try again."
            else
              echo "The GH_PAT secret is a fine-grained token (scopes can't be inspected). It must have Contents: Read and write on $MATCH_REPO."
            fi
          fi

          if [ -n "$failed" ]; then
            exit 2
          fi

      - name: Validate ${{ env.MATCH_REPO }}
        run: |
          set -o pipefail
          REPO="${{ github.repository_owner }}/$MATCH_REPO"

          # If the certificates repository does not exist, create it (private).
          if ! visibility=$(gh repo view "$REPO" --json visibility | jq --raw-output '.visibility | ascii_downcase'); then
            echo "'$REPO' could not be found using the GH_PAT secret. Attempting to create it..."
            if gh repo create "$REPO" --private >/dev/null && [ "$(gh repo view "$REPO" --json visibility | jq --raw-output '.visibility | ascii_downcase')" == "private" ]; then
              echo "Created the private repository '$REPO'."
            else
              failed=true
              echo "::error::Unable to create the private repository '$REPO'. Create an empty PRIVATE repository named '$MATCH_REPO' on your account by hand and try again. If it already exists, check that the GH_PAT can access it."
            fi
          elif [[ "$visibility" == "public" ]]; then
            failed=true
            echo "::error::'$REPO' exists but is PUBLIC. It stores your signing certificate: make it private (Settings → General → Danger Zone → Change visibility) and try again."
          else
            echo "Found the private repository '$REPO'."
          fi

          if [ -n "$failed" ]; then
            exit 2
          fi

  validate-fastlane-secrets:
    name: Fastlane
    needs: [validate-access-token]
    runs-on: macos-26
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      TEAMID: ${{ secrets.TEAMID }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install Project Dependencies
        run: bundle install

      # Sync the runner clock (workaround from https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Validate Fastlane Secrets
        run: |
          # TEAMID
          if [ -z "$TEAMID" ]; then
            failed=true
            echo "::error::The TEAMID secret is unset or empty. Set it and try again."
          elif [ ${#TEAMID} -ne 10 ]; then
            failed=true
            echo "::error::The TEAMID secret has the wrong length (it is 10 characters). Copy it from https://developer.apple.com/account → Membership details and try again."
          elif ! [[ $TEAMID =~ ^[A-Z0-9]+$ ]]; then
            failed=true
            echo "::error::The TEAMID secret is invalid (only uppercase letters and numbers). Verify it and try again."
          fi

          # MATCH_PASSWORD
          if [ -z "$MATCH_PASSWORD" ]; then
            failed=true
            echo "::error::The MATCH_PASSWORD secret is unset or empty. Set it and try again."
          fi

          set -o pipefail

          # FASTLANE_ISSUER_ID, FASTLANE_KEY_ID, FASTLANE_KEY
          FASTLANE_KEY_ID_PATTERN='^[A-Z0-9]+$'
          FASTLANE_ISSUER_ID_PATTERN='^\{?[A-F0-9a-f]{8}-[A-F0-9a-f]{4}-[A-F0-9a-f]{4}-[A-F0-9a-f]{4}-[A-F0-9a-f]{12}\}?$'

          if [ -z "$FASTLANE_ISSUER_ID" ] || [ -z "$FASTLANE_KEY_ID" ] || [ -z "$FASTLANE_KEY" ]; then
            failed=true
            [ -z "$FASTLANE_ISSUER_ID" ] && echo "::error::The FASTLANE_ISSUER_ID secret is unset or empty. Set it and try again."
            [ -z "$FASTLANE_KEY_ID"    ] && echo "::error::The FASTLANE_KEY_ID secret is unset or empty. Set it and try again."
            [ -z "$FASTLANE_KEY"       ] && echo "::error::The FASTLANE_KEY secret is unset or empty. Set it and try again."
          elif [ ${#FASTLANE_KEY_ID} -ne 10 ]; then
            failed=true
            echo "::error::The FASTLANE_KEY_ID secret has the wrong length. Copy it from the 'Keys' tab at https://appstoreconnect.apple.com/access/integrations/api and try again."
          elif ! [[ $FASTLANE_KEY_ID =~ $FASTLANE_KEY_ID_PATTERN ]]; then
            failed=true
            echo "::error::The FASTLANE_KEY_ID secret is invalid. Copy it from the 'Keys' tab at https://appstoreconnect.apple.com/access/integrations/api and try again."
          elif ! [[ $FASTLANE_ISSUER_ID =~ $FASTLANE_ISSUER_ID_PATTERN ]]; then
            failed=true
            echo "::error::The FASTLANE_ISSUER_ID secret is invalid. Copy the Issuer ID from the 'Keys' tab at https://appstoreconnect.apple.com/access/integrations/api and try again."
          elif ! echo "$FASTLANE_KEY" | openssl pkcs8 -nocrypt >/dev/null; then
            failed=true
            echo "::error::The FASTLANE_KEY secret is invalid. Paste the WHOLE content of the AuthKey_XXXXXXXXXX.p8 file, including the BEGIN/END PRIVATE KEY lines, and try again."
          elif ! bundle exec fastlane validate_secrets 2>&1 | tee fastlane.log; then
            if grep -q "Couldn't decrypt the repo" fastlane.log; then
              failed=true
              echo "::error::Unable to decrypt $MATCH_REPO with the MATCH_PASSWORD secret. Use the same password that first encrypted it (or empty that repository to start over) and try again."
            elif grep -q -e "required agreement" -e "license agreement" fastlane.log; then
              failed=true
              echo "::error::❗️ Accept the latest Apple Developer Program License Agreement at https://developer.apple.com/account, wait a few minutes, then try again."
            elif grep -q "Your certificate .* is not valid" fastlane.log; then
              echo "::notice::Your Distribution certificate is invalid or expired. '3. Create Certificates' will renew it if ENABLE_NUKE_CERTS is 'true'."
            else
              # Not fatal on purpose: on the very first run the certificates repository is still empty, and
              # read-only match exits non-zero because there is no certificate yet — '3. Create Certificates'
              # is what creates it, so failing here would block that step forever.
              echo "::notice::fastlane validate_secrets reported a non-fatal issue (normal before the first '3. Create Certificates'). See the log above."
            fi
          fi

          if [ -n "$failed" ]; then
            exit 2
          fi
